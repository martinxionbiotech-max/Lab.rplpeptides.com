    - Peptide Synthesizer: equipment/peptide-synthesizer.md
    - Preparative HPLC: equipment/preparative-hplc.md
    - Analytical HPLC: equipment/analytical-hplc.md
    - LC-MS System: equipment/lc-ms.md
    - Mass Spectrometer: equipment/mass-spectrometer.md
    - Freeze Dryer: equipment/freeze-dryer.md
    - Vacuum Drying System: equipment/vacuum-drying-system.md
    - Flash Chromatography: equipment/flash-chromatography.md
    - Reactor System: equipment/reactor.md
