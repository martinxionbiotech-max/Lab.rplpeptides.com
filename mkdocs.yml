site_name: RPL Peptides Lab — Technical Documentation
site_url: https://lab.rplpeptides.com/
site_description: Technical knowledge base for peptide manufacturing — SPPS process, purification, quality control, equipment, and raw material specifications.
copyright: Copyright &copy; 2026 RPL Peptides

theme:
  name: material
  custom_dir: overrides
  palette:
    primary: teal
    accent: light blue
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - glightbox
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Manufacturing:
    - manufacturing/index.md
    - Peptide Synthesis Overview: manufacturing/peptide-synthesis-overview.md
    - SPPS vs. Liquid-Phase: manufacturing/spps-vs-liquid-phase.md
    - Manufacturing Workflow: manufacturing/manufacturing-workflow.md
    - Production Scale: manufacturing/production-scale.md
  - Process Knowledge:
    - process/index.md
    - SPPS Process: process/spps-process.md
    - Resin Loading: process/resin-loading.md
    - Coupling Reaction: process/coupling-reaction.md
    - Deprotection: process/deprotection.md
    - Cleavage: process/cleavage.md
    - Purification: process/purification.md
    - Lyophilization: process/lyophilization.md
    - Peptide Folding: process/peptide-folding.md
    - Custom Synthesis: process/custom-synthesis.md
  - Difficult Sequences: process/difficult-sequences.md
  - Scale-Up Considerations: process/scale-up-considerations.md
  - Equipment Database:
