site_name: RPL Peptides Lab — Technical Documentation
site_url: https://lab.rplpeptides.com/
site_description: Technical knowledge base for peptide manufacturing — SPPS process, purification, quality control, equipment, and raw material specifications.
copyright: Copyright &copy; 2026 RPL Peptides

theme:
  name: material
  custom_dir: overrides
  palette:
    primary: teal
    accent: light blue
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - glightbox
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - footnotes
  - toc:
      permalink: true

